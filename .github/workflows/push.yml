# 예비 알림 서버: 평소엔 Firebase(functions/)가 5분마다 보내고, 이건 Firebase가 15분 넘게 멈췄을 때만 대신 보냅니다.
# (GitHub 사정에 따라 실제로는 수십 분마다 실행돼요)
# 필요한 것: 저장소 Settings → Secrets and variables → Actions 에 FIREBASE_SERVICE_ACCOUNT
# 선생님 앱 [설정]에서 폰 알림을 꺼 두면 확인만 하고 아무것도 보내지 않아요.
name: Send phone notifications (backup)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/push/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: scripts/push
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: node scripts/push/send.mjs
